name: Build Windows app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Core checks
        shell: pwsh
        run: |
          python -m pip install --quiet pillow piexif pillow-heif
          python -I tools/make_test_photos.py "$env:RUNNER_TEMP/photos"
          dotnet run --project tests/CoreTests -c Release -- "$env:RUNNER_TEMP/photos"

      - name: Publish
        run: dotnet publish src/PhotoMapViewer/PhotoMapViewer.csproj -c Release -o publish

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path publish/* -DestinationPath out/PhotoMapViewer.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PhotoMapViewer
          path: publish/
          retention-days: 30

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/PhotoMapViewer.zip
