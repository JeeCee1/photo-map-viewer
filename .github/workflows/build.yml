name: Build Windows app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Get ExifTool
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest https://exiftool.org/ver.txt -UseBasicParsing).Content.Trim()
          Write-Host "ExifTool $ver"
          Invoke-WebRequest "https://exiftool.org/exiftool-${ver}_64.zip" -OutFile "$env:RUNNER_TEMP/exiftool.zip" -UseBasicParsing
          Expand-Archive "$env:RUNNER_TEMP/exiftool.zip" -DestinationPath "$env:RUNNER_TEMP/exiftool-x"
          $dir = Get-ChildItem "$env:RUNNER_TEMP/exiftool-x" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force tools-bin/exiftool | Out-Null
          Copy-Item "$($dir.FullName)/*" tools-bin/exiftool -Recurse
          Rename-Item "tools-bin/exiftool/exiftool(-k).exe" exiftool.exe
          & tools-bin/exiftool/exiftool.exe -ver

      - name: Core checks
        shell: pwsh
        run: |
          python -m pip install --quiet pillow piexif pillow-heif
          python -I tools/make_test_photos.py "$env:RUNNER_TEMP/photos"
          $env:EXIFTOOL = (Resolve-Path tools-bin/exiftool/exiftool.exe).Path
          dotnet run --project tests/CoreTests -c Release -- "$env:RUNNER_TEMP/photos"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/PhotoMapViewer/PhotoMapViewer.csproj -c Release -o publish
          New-Item -ItemType Directory -Force publish/tools | Out-Null
          Copy-Item tools-bin/exiftool publish/tools -Recurse

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path publish/* -DestinationPath out/PhotoMapViewer.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PhotoMapViewer
          path: publish/
          retention-days: 30

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/PhotoMapViewer.zip
