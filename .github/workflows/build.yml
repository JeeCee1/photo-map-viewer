name: Build Windows app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Get ExifTool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          try { $ver = (Invoke-WebRequest https://exiftool.org/ver.txt -UseBasicParsing).Content.Trim() }
          catch { Write-Host "::error::Could not read exiftool.org/ver.txt: $($_.Exception.Message)"; throw }
          Write-Host "ExifTool version $ver"
          $zip = "$env:RUNNER_TEMP/exiftool.zip"
          $urls = @(
            "https://exiftool.org/exiftool-${ver}_64.zip",
            "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download"
          )
          $got = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile $zip -UseBasicParsing -UserAgent "Wget"; $got = $true; Write-Host "Downloaded $u"; break }
            catch { Write-Host "::warning::Download failed: $u — $($_.Exception.Message)" }
          }
          if (-not $got) { Write-Host "::error::ExifTool download failed"; exit 1 }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/exiftool-x" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP/exiftool-x" -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          if (-not $exe) {
            $list = (Get-ChildItem "$env:RUNNER_TEMP/exiftool-x" -Recurse | Select-Object -First 20 | ForEach-Object { $_.FullName }) -join ' | '
            Write-Host "::error::No exiftool exe in the zip: $list"; exit 1
          }
          New-Item -ItemType Directory -Force tools-bin/exiftool | Out-Null
          Copy-Item "$($exe.DirectoryName)/*" tools-bin/exiftool -Recurse
          Rename-Item "tools-bin/exiftool/$($exe.Name)" exiftool.exe
          $v = & tools-bin/exiftool/exiftool.exe -ver
          Write-Host "::notice::Bundled ExifTool $v"

      - name: Core checks
        shell: pwsh
        run: |
          python -m pip install --quiet pillow piexif pillow-heif
          python -I tools/make_test_photos.py "$env:RUNNER_TEMP/photos"
          $env:EXIFTOOL = (Resolve-Path tools-bin/exiftool/exiftool.exe).Path
          dotnet run --project tests/CoreTests -c Release -- "$env:RUNNER_TEMP/photos"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/PhotoMapViewer/PhotoMapViewer.csproj -c Release -o publish
          New-Item -ItemType Directory -Force publish/tools | Out-Null
          Copy-Item tools-bin/exiftool publish/tools -Recurse

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path publish/* -DestinationPath out/PhotoMapViewer.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: PhotoMapViewer
          path: publish/
          retention-days: 30

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/PhotoMapViewer.zip
